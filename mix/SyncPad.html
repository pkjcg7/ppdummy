<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Sync Pad</title>
    <style>
        :root {
            --bg-color: #dadade;
            --container-bg: #ffffff;
            --accent-color: #007bff;
            --text-gray: #666;
            --border-radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            font-family: 'Inter', -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 7px; /* Sleek outer margin */
        }

        /* Restored Underline Tabs */
        .tabs {
            display: flex;
            gap: 11px;
            /* margin-bottom: 10px; */
            padding-left: 9px;
        }

        .tab-btn {
            padding: 8px 5px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: #888;
            border-bottom: 3px solid transparent;
            transition: 0.3s;
        }

        .tab-btn.active {
            color: var(--accent-color);
            border-bottom: 3px solid var(--accent-color); /* The blue horizontal line */
        }

        /* Main Container */
        .container {
            flex-grow: 1;
            background: var(--container-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            display: flex;
        }

        /* Editor - Absolute Zero Padding */
        #text-editor {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            padding-left: 5px; 
            font-size: 18px;
            line-height: 1.6;
            resize: none;
            display: block;
            font-family: inherit;
        }

        /* Viewer - Vertical wrap only */
        /* #viewer {
            width: 100%;
            height: 100%;
            padding: 5px;
            font-size: 18px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-y: auto;
            display: none;
        } */

        /* Viewer - Vertical wrap only */
        #viewer {
            width: 100%;
            height: 100%;
            padding: 5px;
            font-size: 18px;
            line-height: 1.8;
            
            /* Crucial for preventing horizontal scroll */
            white-space: pre-wrap;       /* Respects line breaks and wraps */
            word-wrap: break-word;       /* Legacy support */
            overflow-wrap: break-word;   /* Breaks long words if needed */
            word-break: break-word;      /* Ensures wrapping in all browsers */
            
            overflow-y: auto;            /* Vertical scroll only */
            overflow-x: hidden;          /* Explicitly kill horizontal scroll */
            display: none;
        }
/* Copy Elements - Single Unified Box */
        .copy-wrapper {
            background: #f0f7ff;
            border: 1px solid #d0e3ff;
            padding: 4px 8px;
            border-radius: 8px;
            
            /* This forces everything into ONE container */
            display: inline-block; 
            
            /* This allows the text INSIDE the box to wrap to next lines */
            white-space: normal; 
            max-width: 100%;
            
            /* Keeps it looking like part of the sentence flow */
            vertical-align: middle;
            margin: 4px 0;
        }

        .copy-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 2px 10px;
            font-size: 11px;
            cursor: pointer;
            font-style: italic;
            font-weight: bold;
            transition: all 0.2s ease;
            margin-left: 8px;
            
            /* Ensures button stays on the same line as the final word */
            display: inline-block;
            vertical-align: middle;
            
            /* Keeps the button from being split */
            white-space: nowrap; 
        }
        .copy-btn.success {
            background: #28a745;
        }
    </style>
</head>
<body>

    <div class="tabs">
        <button id="btn-text" class="tab-btn active" onclick="switchMode('text')">Text</button>
        <button id="btn-view" class="tab-btn" onclick="switchMode('viewer')">Viewer</button>
    </div>

    <div class="container">
        <textarea id="text-editor" placeholder="Type {content inside braces} to see the copy button in Viewer..."></textarea>
        <div id="viewer"></div>
    </div>

    <script>
        const editor = document.getElementById('text-editor');
        const viewer = document.getElementById('viewer');

        // Sync logic
        const saved = localStorage.getItem('sleek_sync_v3');
        if (saved) editor.value = saved;

        editor.addEventListener('input', () => {
            localStorage.setItem('sleek_sync_v3', editor.value);
        });

        // Auto-wrap selection with curly braces
        editor.addEventListener('keydown', function(e) {
            // Check if the key pressed is '{' (Shift + '[')
            if (e.key === '{') {
                const start = this.selectionStart;
                const end = this.selectionEnd;

                // Only wrap if text is actually selected
                if (start !== end) {
                    e.preventDefault(); // Prevent the default '{' insertion

                    const selectedText = this.value.substring(start, end);
                    const beforeText = this.value.substring(0, start);
                    const afterText = this.value.substring(end);

                    // Wrap the selected text
                    this.value = beforeText + '{' + selectedText + '}' + afterText;

                    // Restore selection and cursor position
                    this.selectionStart = start;
                    this.selectionEnd = end + 2; // +2 to account for the { and }

                    // Trigger the input event to save to localStorage
                    this.dispatchEvent(new Event('input'));
                }
            }
        });

        function switchMode(mode) {
            const isText = mode === 'text';
            editor.style.display = isText ? 'block' : 'none';
            viewer.style.display = isText ? 'none' : 'block';
            
            document.getElementById('btn-text').classList.toggle('active', isText);
            document.getElementById('btn-view').classList.toggle('active', !isText);

            if (!isText) renderViewer();
        }

        function renderViewer() {
            let content = editor.value;
            // Escape HTML
            let safeContent = content.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            // Replaces {text} with text + button (removing the braces visually)
            const regex = /\{([^}]+)\}/g;
            
            const rendered = safeContent.replace(regex, (match, innerText) => {
                // Return just the innerText and the Bold Italic button
               // return `<span class="copy-wrapper">${innerText} <button class="copy-btn" onclick="copyAction(this, \`${innerText.replace(/'/g, "\\'")}\`)">Copy</button></span>`;
         // Correct way: ${innerText}<button...
return `<span class="copy-wrapper">${innerText}<button class="copy-btn" onclick="copyAction(this, \`${innerText.replace(/'/g, "\\'")}\`)">Copy</button></span>`;
            });

            viewer.innerHTML = rendered;
        }

        function copyAction(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                const oldText = btn.innerText;
                btn.innerText = 'Copied';
                btn.classList.add('success');
                
                setTimeout(() => {
                    btn.innerText = 'Copy';
                    btn.classList.remove('success');
                }, 2000);
            });
        }
    </script>
</body>
</html>
