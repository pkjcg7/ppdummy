<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Extractor Tool</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #d1d5db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        .container {
            display: flex;
            gap: 20px;
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .panel {
            flex: 1;
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .panel h3 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #4b5563;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 10px;
        }

        textarea {
            flex: 1;
            width: 100%;
            resize: none;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #e5e7eb;
            color: #374151;
        }

        .btn-secondary:hover {
            background-color: #d1d5db;
        }

        /* Responsive design for smaller screens */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- <h2>Email Extractor Utility</h2> -->

    <div class="container">
        <!-- Input Section -->
        <div class="panel">
            <h3>Input Data (Comma Separated)</h3>
            <textarea id="inputText" placeholder="Paste your comma-separated values here..."></textarea>
            <div class="btn-group">
                <button class="btn-secondary" onclick="clearInput()">Clear Input</button>
            </div>
        </div>

        <!-- Output Section -->
        <div class="panel">
            <h3>Extracted Unique Emails</h3>
            <textarea id="outputText" readonly placeholder="Unique extracted emails will appear here..."></textarea>
            <div class="btn-group">
                <button class="btn-primary" onclick="copyOutput()">Copy Output</button>
                <button class="btn-secondary" onclick="clearAll()">Clear All</button>
            </div>
        </div>
    </div>

    <script>
        const inputTextArea = document.getElementById('inputText');
        const outputTextArea = document.getElementById('outputText');

        // Automatically process whenever the input text changes
        inputTextArea.addEventListener('input', processEmails);

        function processEmails() {
            const rawText = inputTextArea.value;
            if (!rawText.trim()) {
                outputTextArea.value = '';
                return;
            }

            // Clean quotes and split by commas
            const items = rawText.split(',').map(item => item.trim().replace(/^['"]|['"]$/g, ''));

            // Filter items that look like an email address (contains '@' and '.')
            const emails = items.filter(item => item.includes('@') && item.includes('.'));

            // Remove duplicate emails (case-insensitive deduplication)
            const uniqueEmails = [...new Set(emails.map(email => email.toLowerCase()))];

            // Format unique items with single quotes
            const formattedEmails = uniqueEmails.map(email => `'${email}'`).join(',');

            outputTextArea.value = formattedEmails;
        }

        function copyOutput() {
            if (!outputTextArea.value) {
                alert('No output to copy!');
                return;
            }
            outputTextArea.select();
            navigator.clipboard.writeText(outputTextArea.value).then(() => {
                alert('Copied to clipboard successfully!');
            }).catch(err => {
                console.error('Failed to copy text: ', err);
            });
        }

        function clearInput() {
            inputTextArea.value = '';
            outputTextArea.value = '';
            inputTextArea.focus();
        }

        function clearAll() {
            inputTextArea.value = '';
            outputTextArea.value = '';
            inputTextArea.focus();
        }
    </script>

</body>
</html>
