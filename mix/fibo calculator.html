<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibonacci Percentage Levels Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Remove default number input spinner arrows */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">

    <div class="w-full max-w-3xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8">
        <!-- Header -->
        <!-- <div class="text-center mb-8">
            <span class="bg-indigo-500/10 text-indigo-400 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider border border-indigo-500/20">Trading & Math Tool</span>
            <h1 class="text-2xl sm:text-3xl font-bold mt-3 tracking-tight text-white">Fibonacci Percentage Calculator</h1>
            <p class="text-slate-400 text-sm mt-1">Calculates upside and downside levels using Fibonacci sequence percentages (8% to 144%).</p>
        </div> -->

        <!-- Input Section -->
        <div class="mb-8 bg-slate-950/50 p-4 rounded-xl border border-slate-800">
            <label for="baseValue" class="block text-sm font-medium text-slate-300 mb-2">Enter Base Value:</label>
            <div class="relative rounded-md shadow-sm">
                <input type="number" id="baseValue" value="100" placeholder="e.g. 100" 
                    class="block w-full rounded-lg bg-slate-900 border border-slate-700 px-4 py-3 text-white placeholder-slate-500 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 focus:outline-none transition sm:text-sm">
            </div>
        </div>

        <!-- Results Table/Grid -->
        <div class="overflow-x-auto rounded-xl border border-slate-800">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-950/80 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
                        <th class="py-3 px-4 font-semibold">Fib % Level</th>
                        <th class="py-3 px-4 font-semibold text-rose-400">Downside Value</th>
                        <th class="py-3 px-4 font-semibold text-emerald-400">Upside Value</th>
                    </tr>
                </thead>
                <tbody id="resultsBody" class="divide-y divide-slate-800/60 text-sm">
                    <!-- Javascript will populate rows here -->
                </tbody>
            </table>
        </div>
        
        <div class="mt-6 text-center text-xs text-slate-500">
            Formula: Value &plusmn; (Value &times; Percentage / 100)
        </div>
    </div>

    <!-- Script to handle calculation logic -->
    <script>
        const fibPercentages = [8, 13, 21, 34, 55, 75, 89, 111, 121, 144];
        const inputElement = document.getElementById('baseValue');
        const resultsBody = document.getElementById('resultsBody');

        function calculateLevels() {
            const val = parseFloat(inputElement.value);
            resultsBody.innerHTML = '';

            if (isNaN(val)) {
                resultsBody.innerHTML = `<tr><td colspan="3" class="py-4 text-center text-slate-500">Please enter a valid number</td></tr>`;
                return;
            }

            fibPercentages.forEach(percent => {
                const delta = val * (percent / 100);
                const downside = val - delta;
                const upside = val + delta;

                const row = document.createElement('tr');
                row.className = "hover:bg-slate-800/40 transition";
                row.innerHTML = `
                    <td class="py-3.5 px-4 font-medium text-slate-200">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-medium bg-slate-800 text-indigo-300 border border-slate-700">
                            ${percent}%
                        </span>
                    </td>
                    <td class="py-3.5 px-4 text-rose-400 font-mono">${downside.toFixed(2)}</td>
                    <td class="py-3.5 px-4 text-emerald-400 font-mono">${upside.toFixed(2)}</td>
                `;
                resultsBody.appendChild(row);
            });
        }

        // Event listener for real-time calculation
        inputElement.addEventListener('input', calculateLevels);

        // Initial render on page load
        calculateLevels();
    </script>
</body>
</html>
